{% extends "base.html" %}
{% block title %}Sign up{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-6">
  <div class="card"><div class="card-body p-4">
    <h1 class="h4">Create a citizen account</h1>
    <p class="text-muted small">Field Authority and Desk Admin roles are granted by a Desk Admin.</p>
    <form method="post" novalidate>{% csrf_token %}
      {% include "core/_form_fields.html" %}
      <button class="btn btn-primary w-100">Sign up</button>
    </form>
  </div></div>
</div></div>
{% endblock %}
