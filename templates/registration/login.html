{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-5">
  <div class="card"><div class="card-body p-4">
    <h1 class="h4 mb-3">Log in</h1>
    {% if form.errors %}<div class="alert alert-danger">Invalid username or password.</div>{% endif %}
    <form method="post">{% csrf_token %}
      <div class="mb-3"><label class="form-label" for="id_username">Username</label>
        <input class="form-control" name="username" id="id_username" autofocus required value="{{ form.username.value|default:'' }}"></div>
      <div class="mb-3"><label class="form-label" for="id_password">Password</label>
        <input class="form-control" type="password" name="password" id="id_password" required></div>
      <input type="hidden" name="next" value="{{ next }}">
      <button class="btn btn-primary w-100">Log in</button>
    </form>
    <p class="small text-muted mt-3 mb-0">No account? <a href="{% url 'signup' %}">Sign up as a citizen</a>.<br>
    Demo: <code>citizen</code> / <code>field</code> / <code>desk</code> — password <code>demo12345</code></p>
  </div></div>
</div></div>
{% endblock %}
