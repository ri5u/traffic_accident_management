{% extends "base.html" %}
{% block title %}Edit {{ target.username }}{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-lg-6"><div class="card"><div class="card-body p-4">
  <h1 class="h4">Edit user: {{ target.username }}</h1>
  <p class="small text-muted">Changes are written to the audit log.</p>
  <form method="post" novalidate>{% csrf_token %}{% include "core/_form_fields.html" %}
    <button class="btn btn-primary">Save</button> <a href="{% url 'user_list' %}" class="btn btn-link">Cancel</a></form>
</div></div></div></div>
{% endblock %}
