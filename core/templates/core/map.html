{% extends "base.html" %}
{% block title %}Operational map{% endblock %}
{% block content %}
<div class="d-flex flex-wrap justify-content-between align-items-center mb-2 gap-2">
  <h1 class="h3 mb-0">Operational map</h1>
  <div class="small">
    <span class="legend-dot" style="background:#f0ad00"></span>Reported
    <span class="legend-dot ms-2" style="background:#dc3545"></span>Verified
    <span class="legend-dot ms-2" style="background:#0d6efd"></span>Assigned
    <span class="legend-dot ms-2" style="background:#8a8f98;opacity:.5"></span>Stale
    <span class="ms-3">Shaded circles = blockages (dashed = needs re-confirmation)</span>
  </div>
</div>
<div id="ops-map" class="map-lg" data-ops-map data-src="{% url 'api_map_data' %}"></div>
{% endblock %}
