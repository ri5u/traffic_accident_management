{% extends "base.html" %}
{% block title %}Operational map{% endblock %}
{% block content %}
<div class="page-head mb-3">
  <div><div class="eyebrow">Live</div><h1 class="h3">Operational map</h1></div>
  <div class="legend">
    <span><span class="legend-dot" style="background:#f59e0b"></span>Reported</span>
    <span><span class="legend-dot" style="background:#ef4444"></span>Verified</span>
    <span><span class="legend-dot" style="background:#3b82f6"></span>Assigned</span>
    <span><span class="legend-dot" style="background:#94a3b8;opacity:.6"></span>Stale</span>
    <span><i class="bi bi-circle-fill" style="color:rgba(239,68,68,.35)"></i> Blockage (dashed = needs re-confirmation)</span>
  </div>
</div>
<div id="ops-map" class="map-lg" data-ops-map data-src="{% url 'api_map_data' %}"></div>
{% endblock %}
